<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wadi Chromecast Receiver</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
      }

      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      #video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #idle {
        position: absolute;
        color: #ffffffa8;
        font-family: sans-serif;
        letter-spacing: 0.02em;
        text-align: center;
      }
    </style>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <div id="app">
      <video id="video" playsinline></video>
      <div id="idle">Wadi Chromecast Receiver</div>
    </div>
    <script src="./receiver.js"></script>
  </body>
</html>
