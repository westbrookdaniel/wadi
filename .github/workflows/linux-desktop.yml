name: Linux desktop checks
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/frontend/**'
      - 'package.json'
      - 'scripts/browser-qa/**'
      - 'scripts/native-qa/**'
      - 'scripts/player-smoke/**'
      - '.github/workflows/desktop-release.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/linux-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/frontend/**'
      - 'package.json'
      - 'scripts/browser-qa/**'
      - 'scripts/native-qa/**'
      - 'scripts/player-smoke/**'
      - '.github/workflows/desktop-release.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/linux-desktop.yml'
concurrency:
  group: player-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-player-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:qa-fixtures
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @wadi/desktop prepare:assets
        env:
          WADI_WEB_ORIGIN: https://watchwadi.com
      - run: pnpm --filter frontend build
      - run: node scripts/browser-qa/build-bundle.mjs "$RUNNER_TEMP/web-player-qa"
      - name: Archive exact web QA handoff
        run: |
          tar -czf "$RUNNER_TEMP/web-player-qa.tar.gz" -C "$RUNNER_TEMP/web-player-qa" .
          (cd "$RUNNER_TEMP" && sha256sum web-player-qa.tar.gz > web-player-qa.SHA256SUMS)
      - run: pnpm test:player-smoke web "$RUNNER_TEMP/web-player-qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-web-qa-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/web-player-qa.tar.gz
            ${{ runner.temp }}/web-player-qa.SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-player-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            player-smoke-results/**/*.json
            player-smoke-results/**/*.log
            player-smoke-results/**/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-player-smoke-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: player-smoke-results/
          retention-days: 14
  native-candidate:
    # Artifact-only candidate verification. No tags, releases or publication.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # No signing secrets: use the existing identity '-' packaging seal on
      # same-repository candidates; electron-builder otherwise skips PR signing.
      CSC_FOR_PULL_REQUEST: 'true'
      WADI_WEB_ORIGIN: https://watchwadi.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wadi/desktop package --publish never
      - run: pnpm --filter @wadi/desktop test
      - name: Verify finished macOS architecture and signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/Wadi.app)
          test "${#apps[@]}" -gt 0
          for app in "${apps[@]}"; do
            node apps/desktop/scripts/verify-mac-package.mjs "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/media-bin/ffmpeg"
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/media-bin/ffprobe"
          done
      - name: Record exact candidate revision and checksums
        shell: bash
        run: |
          git rev-parse HEAD > apps/desktop/release/REVISION
          node --input-type=module <<'JS'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const root = 'apps/desktop/release';
          const names = (await readdir(root)).filter(name => /\.(zip|dmg|exe)$/.test(name)).sort();
          if (!names.length) throw new Error('Missing candidate artifacts');
          const sums = await Promise.all(names.map(async name => `${createHash('sha256').update(await readFile(`${root}/${name}`)).digest('hex')}  ${name}`));
          await writeFile(`${root}/SHA256SUMS`, sums.join('\n') + '\n');
          console.log(sums.join('\n'));
          JS
      - name: Package isolated synthetic native QA entry
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node scripts/native-qa/build-fixtures.mjs "$RUNNER_TEMP/native-fixtures" apps/desktop/assets/ffmpeg
          node scripts/native-qa/build-bundle.mjs "$RUNNER_TEMP/native-qa" "$RUNNER_TEMP/native-fixtures"
          node scripts/native-qa/package-candidate.mjs "$RUNNER_TEMP/native-qa"
          node scripts/player-smoke/manifest.mjs "$RUNNER_TEMP/native-qa"
          pnpm --filter @wadi/desktop exec electron-builder --projectDir "$RUNNER_TEMP/native-qa" --config "$RUNNER_TEMP/native-qa/electron-builder.json" --mac zip --arm64 --publish never
          node apps/desktop/scripts/verify-mac-package.mjs apps/desktop/native-qa-release/mac-arm64/Wadi.app arm64
          codesign --verify --deep --strict --verbose=2 apps/desktop/native-qa-release/mac-arm64/Wadi.app
          codesign --verify --strict --verbose=2 apps/desktop/native-qa-release/mac-arm64/Wadi.app/Contents/Resources/media-bin/ffmpeg
          codesign --verify --strict --verbose=2 apps/desktop/native-qa-release/mac-arm64/Wadi.app/Contents/Resources/media-bin/ffprobe
          cp "$RUNNER_TEMP/native-qa/REVISION" apps/desktop/native-qa-release/REVISION
          tar -czf apps/desktop/native-qa-release/fixtures.tar.gz -C "$RUNNER_TEMP/native-qa" fixtures
          cd apps/desktop/native-qa-release
          shasum -a 256 *.zip fixtures.tar.gz REVISION > SHA256SUMS
          cat SHA256SUMS
      - name: Real sealed macOS arm64 player smoke
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          (cd apps/desktop/native-qa-release && shasum -a 256 -c SHA256SUMS)
          pnpm test:player-smoke native "$RUNNER_TEMP/native-qa" apps/desktop/native-qa-release/mac-arm64/Wadi.app/Contents/MacOS/Wadi
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: native-player-diagnostics-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            player-smoke-results/**/*.json
            player-smoke-results/**/*.log
            player-smoke-results/**/*.png
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: native-player-smoke-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: player-smoke-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: synthetic-native-qa-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/native-qa-release/REVISION
            apps/desktop/native-qa-release/SHA256SUMS
            apps/desktop/native-qa-release/*.zip
            apps/desktop/native-qa-release/fixtures.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidate-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/release/REVISION
            apps/desktop/release/SHA256SUMS
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
  frontend-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: wadi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/wadi_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend exec tsc --noEmit
      - run: pnpm --filter frontend test
      - run: pnpm --filter frontend test:api
  linux-desktop:
    runs-on: ubuntu-latest
    env:
      WADI_WEB_ORIGIN: https://watchwadi.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash -n apps/desktop/scripts/setup-linux.sh
      - run: pnpm --filter @wadi/desktop package --linux deb AppImage --publish never
      - run: pnpm --filter @wadi/desktop test
      - name: Verify Linux desktop package
        shell: bash
        run: |
          mkdir /tmp/wadi-package
          dpkg-deb -x apps/desktop/release/*.deb /tmp/wadi-package
          desktop=/tmp/wadi-package/usr/share/applications/wadi.desktop
          grep -Fx 'StartupWMClass=wadi' "$desktop"
          grep -Fx 'Exec=/opt/Wadi/wadi --fullscreen' "$desktop"
          test -f /tmp/wadi-package/usr/share/icons/hicolor/48x48/apps/wadi.png
          test -f /tmp/wadi-package/usr/share/icons/hicolor/256x256/apps/wadi.png
          test -x /tmp/wadi-package/opt/Wadi/wadi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
