name: Build desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      web_origin:
        description: HTTPS origin of the hosted Wadi app (artifact builds only)
        required: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      WADI_RELEASE_REPOSITORY: ${{ vars.WADI_RELEASE_REPOSITORY || github.repository }}
      WADI_WEB_ORIGIN: ${{ inputs.web_origin || vars.WADI_WEB_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate release configuration
        shell: bash
        run: node apps/desktop/scripts/validate-release.mjs
      - name: Verify public update source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          test "$(gh repo view "$WADI_RELEASE_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC || { echo 'Updates need a public releases repository. Configure WADI_RELEASE_REPOSITORY and GH_RELEASE_TOKEN for a separate repository.'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        shell: bash
        run: |
          pnpm --filter @wadi/desktop package --publish never
      - name: Verify macOS app signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/Wadi.app)
          test "${#apps[@]}" -gt 0
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/media-bin/ffmpeg"
            codesign --verify --strict --verbose=2 "$app/Contents/Resources/media-bin/ffprobe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wadi-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wadi-*
          merge-multiple: true
          path: release
      - name: Create draft release with installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ vars.WADI_RELEASE_REPOSITORY || github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "Wadi $RELEASE_TAG" --notes "macOS installers use ad-hoc signing and are not notarized by Apple. After the first blocked launch, open System Settings > Privacy & Security > Open Anyway to approve Wadi. Windows and Linux installers remain unsigned. Wadi checks for updates and opens the installer download in your browser. Install new versions manually."
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to replace files in a published release'; exit 1; }
          gh release upload "$RELEASE_TAG" release/* --clobber
